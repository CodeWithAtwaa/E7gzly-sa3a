<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07130D">
  <title>Create Account | E7gezly</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            turf: {
              950: '#07130D', 900: '#0B1F16', 800: '#112A1E', 700: '#173A29',
              600: '#15803D', 500: '#16A34A', 400: '#22C55E', 300: '#86EFAC', 100: '#DCFCE7'
            }
          },
          fontFamily: { display: ['Outfit', 'sans-serif'], sans: ['Inter', 'sans-serif'] }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <script src="../main.js" defer></script>
</head>
<body>
  <a href="../index.html" class="fixed top-4 left-4 z-20 btn-ghost rounded-xl px-4 py-2 text-sm font-semibold">← Back to Home</a>
  <main>
    <section id="signupView" class="view auth-screen px-4 py-10 md:py-14 flex items-center justify-center">
      <div class="auth-card rounded-[28px] p-7 md:p-9 relative z-10 my-auto">
        <div class="text-center">
          <div class="auth-mark w-14 h-14 rounded-2xl mx-auto flex items-center justify-center text-2xl">⚽</div>
          <div class="font-display text-2xl font-black tracking-tight mt-3">E7gezly<span class="text-green-300">.</span>
          </div>
          <h1 class="font-display text-3xl md:text-4xl font-bold mt-5">Join the <span
              class="text-green-300">Squad.</span></h1>
          <p class="text-xs text-green-100/50 mt-2">Create a player account to request bookings at this field.</p>
        </div>
        <form id="signupForm" class="mt-5 space-y-3">
          <div><label class="auth-label" for="signupName">FULL NAME</label><input id="signupName" name="name"
              autocomplete="name" class="auth-input" placeholder="Your full name" required minlength="2"></div>
          <div><label class="auth-label" for="signupEmail">EMAIL ADDRESS</label><input id="signupEmail" name="email"
              class="auth-input" type="email" autocomplete="email" placeholder="you@example.com" required></div>
          <div><label class="auth-label" for="signupPhone">EGYPTIAN MOBILE NUMBER</label><input id="signupPhone"
              name="phone" class="auth-input" type="tel" autocomplete="tel" inputmode="tel"
              placeholder="+20 1XX XXX XXXX" required pattern="(\+20|0)?1[0125][0-9]{8}"
              title="Enter a valid Egyptian mobile number, e.g. +20 100 123 4567"></div>
          <div class="auth-field"><label class="auth-label" for="signupPassword">PASSWORD</label><input
              id="signupPassword" class="auth-input pr-16" type="password"
              placeholder="Create a password (8+ characters)" required minlength="8"><button type="button"
              class="eye-toggle" onclick="togglePassword('signupPassword',this)">Show</button></div>
          <div class="auth-field"><label class="auth-label" for="signupConfirm">CONFIRM PASSWORD</label><input
              id="signupConfirm" class="auth-input pr-16" type="password" placeholder="Repeat your password" required
              minlength="8"><button type="button" class="eye-toggle"
              onclick="togglePassword('signupConfirm',this)">Show</button></div>
          <button type="submit" class="btn-primary w-full rounded-xl py-3.5 font-bold text-sm mt-2">Create Player Account <span
              class="ml-1">→</span></button>
        </form>
        <p class="text-center text-xs text-green-100/55 mt-6">Already have an account? <a href="./signin.html" class="text-green-300 font-bold hover:text-green-100">Sign In</a></p>
      </div>

    </section>
  </main>
  <div id="toastHost" class="fixed bottom-5 right-5 z-[80] space-y-2"></div>
</body>
</html>
